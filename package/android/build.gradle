
buildscript {
  repositories {
    mavenCentral()
    google()
  }

  dependencies {
    classpath("com.android.tools.build:gradle:7.1.1")
    classpath("com.facebook.react:react-native-gradle-plugin")
    classpath("de.undercouch:gradle-download-task:5.0.1")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'com.facebook.react'
apply plugin: 'org.jetbrains.kotlin.android'

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (findProperty('ReactNativeSlider_' + name) ?: defaultConfigFor(name))
}

def getExtOrIntegerDefault(name) {
  return (rootProject.ext.has(name) ? rootProject.ext.get(name) : (findProperty('ReactNativeSlider_' + name) ?: defaultConfigFor(name))).toInteger()
}

def defaultConfigFor(name) {
  switch (name) {
    case 'compileSdkVersion':
    case 'targetSdkVersion':
      return 35
    case 'buildToolsVersion':
      return '35.0.0'
    case 'minSdkVersion':
      return 21
    default:
      throw new GradleException("Missing configuration value for ${name}")
  }
}

android {

  def agpVersion = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  // Check AGP version for backward compatibility w/react-native versions still on gradle plugin 6
  def major = agpVersion[0].toInteger()
  def minor = agpVersion[1].toInteger()
  if ((major == 7 && minor >= 3) || major >= 8) {
    namespace "com.reactnativecommunity.slider"
    buildFeatures {
      buildConfig true
      compose true
    }
  } else {
    buildFeatures {
      compose true
    }
  }

  compileSdkVersion getExtOrIntegerDefault('compileSdkVersion')
  buildToolsVersion getExtOrDefault('buildToolsVersion')

  composeOptions {
    kotlinCompilerExtensionVersion = "1.5.15"
  }

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault('minSdkVersion')
    targetSdkVersion getExtOrIntegerDefault('targetSdkVersion')
  }

  sourceSets {
    main {
      java.srcDirs += ['src', "${project.buildDir}/generated/source/codegen/java"]
    }
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  //noinspection GradleDynamicVersion
  api 'com.facebook.react:react-native:+'
  implementation platform("androidx.compose:compose-bom:2024.09.03")
  implementation "androidx.activity:activity-compose:1.9.2"
  implementation "androidx.compose.ui:ui"
  implementation "androidx.compose.material3:material3"
  implementation "androidx.compose.ui:ui-tooling-preview"
}

